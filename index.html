<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Workspace, prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="airy.css">
  <link rel="stylesheet" href="lofi.css">
</head>
<body class="airy">
  <div id="app"></div>
  <script>
    (function () {
      var saved = 'airy';
      
      function set(s) {
        document.body.classList.toggle('airy', s === 'airy');
        document.querySelectorAll('.skin button').forEach(function (b) { b.classList.toggle('on', b.dataset.skin === s); });
        
      }
      set(saved);
      if (new URLSearchParams(location.search).get('skin') === 'lofi') { document.body.classList.remove('airy'); document.body.classList.add('lofi'); }
      var wv = 'glow';
      var q = new URLSearchParams(location.search).get('wave'); if (q) wv = q;
      function setW(w) {
        document.body.setAttribute('data-wave', w);
        document.querySelectorAll('.skin [data-wave]').forEach(function (b) { b.classList.toggle('on', b.dataset.wave === w); });
        
      }
      setW(wv);
    })();
  </script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
